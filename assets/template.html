<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="{{ video_name }}">
    <meta property="og:description" content="{{ video_description }}">
    <meta property="og:image" content="https://v.a4barros.com/{{ video_name }}/thumbnail_for_og.jpg">
    <meta property="og:type" content="video.other">
    <title>{{ video_name }} | A4Video</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #222226;
            color: #eee;
            padding: 2em;
	    background-image: url("bg.png");
        }

        video {
            width: 85%;
	    max-width: 1200px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

	h1 {
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
	    font-size: clamp(1rem, 4vw, 2.5rem);
	    margin-bottom: 40px;
	}
    </style>
</head>

<body>
    <h1>{{ video_name }}</h1>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <video id="video" controls poster="thumbnail.jpg"></video>
    <script>
        var video = document.getElementById('video');
        var videoSrc = 'master.m3u8';
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>
</body>

</html>
