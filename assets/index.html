<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="{{ video_name }}">
    <meta property="og:description" content="{{ video_description }}">
    <meta property="og:image" content="https://v.a4barros.com/{{ video_name }}/thumbnail_for_og.jpg">
    <meta property="og:type" content="video.other">
    <title>{{ video_name }} | a4video</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    
    <nav>
        <img src="a4b.svg" style="width: 120px;">
        <div class="nav-stats">
            <div class="stat-item">
                <span id="view-count">0</span>
                <span class="stat-label">Views</span>
            </div>
            <button id="like-btn" class="like-button">
                <span>👍</span>
                <span id="like-count">0</span>
            </button>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <div class="video-container">
        <video id="video" controls poster="thumbnail.jpg"></video>
        <h1>{{ video_name }}</h1>
    </div>
    <script>
        var video = document.getElementById('video');
        var videoSrc = 'master.m3u8';
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>
    <script src="./index.js"></script>
</body>

</html>
